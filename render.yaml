services:
  - type: web
    name: animind-backend
    runtime: python
    pythonVersion: "3.11.0"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # ── REQUIRED — Set ALL of these in Render Dashboard → Environment ──

      # AI Generation (Claude)
      # ANTHROPIC_API_KEY:  your sk-ant-... key

      # Supabase — Auth + Database
      # The backend accepts BOTH the canonical names AND your Render names:
      #
      # SUPABASE_URL     — https://<project-id>.supabase.co
      #
      # SUPABASE_KEY     — Your key set in Render Dashboard
      #                    Maps to: SUPABASE_ANON_KEY + SUPABASE_SERVICE_KEY
      #                    Use the service_role key for full access
      #
      # JWT_KEY          — Your key set in Render Dashboard
      #                    Maps to: SUPABASE_JWT_SECRET
      #                    Get from: Supabase Dashboard -> Settings -> API -> JWT Secret
      #                    This is REQUIRED for login verification to work

      # Admin endpoint protection
      # ADMIN_SECRET_TOKEN:  any long random string

      # ── OPTIONAL ────────────────────────────────────────────────────────
      - key: LOG_LEVEL
        value: "info"
      - key: SHOW_ERROR_DETAILS
        value: "true"
      - key: JWT_EXPIRE_DAYS
        value: "900"
