<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a1628;color:#fff;min-height:100vh;padding:16px}
.page{max-width:820px;margin:0 auto}
.header{text-align:center;margin-bottom:14px}
.header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#facc15,#38bdf8,#4ade80);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:5px}
.header p{font-size:13px;color:#94a3b8}
.tabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);font-size:12px;font-weight:600;cursor:pointer;color:#94a3b8;transition:all .2s;font-family:inherit}
.tab:hover{background:rgba(255,255,255,.1);color:#e2e8f0}
.tab.on{background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.5);color:#7dd3fc}
.scene-wrap{border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.scene{display:none}.scene.on{display:block}
.scene svg{display:block;width:100%}
.info-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.info-box{border-radius:9px;padding:11px 14px;font-size:12.5px;line-height:1.6}
.info-box.solar{background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.28)}
.info-box.wind{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.28)}
.info-box .lbl{font-weight:700;display:block;margin-bottom:3px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.info-box.solar .lbl{color:#fde047}
.info-box.wind .lbl{color:#7dd3fc}
.info-box .val{color:#e2e8f0}
.tip{border-radius:9px;padding:11px 14px;background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.22);font-size:12.5px;color:#a7f3d0;line-height:1.65}
.tip b{color:#6ee7b7}

/* ── Solar scene ── */
@keyframes sunPulse{0%,100%{r:36}50%{r:38.5}}
@keyframes rayRot{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes panelGlow{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes electronFlow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-60}}
@keyframes arrowRight{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
@keyframes heatWave{0%,100%{opacity:.2;transform:scaleX(1)}50%{opacity:.45;transform:scaleX(1.05)}}

/* ── Wind scene ── */
@keyframes bladeSpinF{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes bladeSpinS{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes windFlow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-80}}
@keyframes cloudDrift{0%{transform:translateX(0)}100%{transform:translateX(30px)}}

/* ── Grid scene ── */
@keyframes gridPulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes powerFlow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-50}}
@keyframes battPulse{0%,100%{height:36px;y:289px}50%{height:44px;y:281px}}
@keyframes cityGlow{0%,100%{opacity:.5}50%{opacity:.9}}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>Hybrid Solar–Wind Power Plant</h1>
    <p>How sunlight and wind are harvested together and delivered to the grid</p>
  </div>
  <div class="tabs">
    <button class="tab on"  onclick="go(0,this)">☀️ Solar Array</button>
    <button class="tab"     onclick="go(1,this)">💨 Wind Turbines</button>
    <button class="tab"     onclick="go(2,this)">⚡ Power Grid</button>
  </div>

  <!-- ════ SCENE 0 : SOLAR ARRAY ════ -->
  <div class="scene-wrap">
  <div class="scene on" id="sc0">
  <svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky0" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c1a3a"/><stop offset="100%" stop-color="#1a3a6e"/></linearGradient>
      <linearGradient id="gnd0" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a3a1a"/><stop offset="100%" stop-color="#0a1a0a"/></linearGradient>
      <linearGradient id="panelG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="50%" stop-color="#2a5080"/><stop offset="100%" stop-color="#1a3050"/></linearGradient>
      <linearGradient id="sunG" cx="40%" cy="40%" r="60%"><stop offset="0%" stop-color="#fff9c4"/><stop offset="60%" stop-color="#fde047"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
      <linearGradient id="wireG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#fde047"/></linearGradient>
      <marker id="marR" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
      <marker id="marG" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>

    <!-- sky + ground -->
    <rect width="820" height="480" fill="url(#sky0)"/>
    <rect x="0" y="340" width="820" height="140" fill="url(#gnd0)"/>
    <line x1="0" y1="340" x2="820" y2="340" stroke="#2d5a2d" stroke-width="2"/>

    <!-- sun -->
    <g transform="translate(680,72)">
      <!-- rotating rays -->
      <g style="transform-origin:0px 0px;animation:rayRot 18s linear infinite;">
        <line x1="0" y1="-54" x2="0" y2="-46" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="38" y1="-38" x2="32" y2="-32" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="54" y1="0" x2="46" y2="0" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="38" y1="38" x2="32" y2="32" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="0" y1="54" x2="0" y2="46" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-38" y1="38" x2="-32" y2="32" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-54" y1="0" x2="-46" y2="0" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-38" y1="-38" x2="-32" y2="-32" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <circle cx="0" cy="0" r="36" fill="#fde047">
        <animate attributeName="r" values="36;38.5;36" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="26" fill="#fef9c3" opacity=".7"/>
    </g>

    <!-- sunlight beams hitting panels -->
    <line x1="680" y1="108" x2="195" y2="280" stroke="#fde04750" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="680" y1="108" x2="310" y2="265" stroke="#fde04750" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="680" y1="108" x2="425" y2="272" stroke="#fde04750" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="680" y1="108" x2="540" y2="268" stroke="#fde04550" stroke-width="1" stroke-dasharray="6,4"/>

    <!-- ── Solar panels (tilted 25°) ── -->
    <!-- Panel 1 -->
    <g transform="translate(130,230)">
      <polygon points="-60,50 60,50 70,-10 -50,-10" fill="url(#panelG)" stroke="#4a7aaf" stroke-width="1.5"/>
      <line x1="-40" y1="37" x2="50" y2="37" stroke="#3a6a9f" stroke-width=".8"/>
      <line x1="-20" y1="50" x2="-10" y2="-10" stroke="#3a6a9f" stroke-width=".8"/>
      <line x1="20" y1="50" x2="30" y2="-10" stroke="#3a6a9f" stroke-width=".8"/>
      <polygon points="-60,50 60,50 70,-10 -50,-10" fill="rgba(250,204,21,.06)" style="animation:panelGlow 2s ease-in-out infinite"/>
      <!-- support pole -->
      <line x1="0" y1="44" x2="0" y2="120" stroke="#5a7a8a" stroke-width="3" stroke-linecap="round"/>
      <line x1="-18" y1="100" x2="18" y2="100" stroke="#5a7a8a" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- Panel 2 -->
    <g transform="translate(250,220)">
      <polygon points="-60,50 60,50 70,-10 -50,-10" fill="url(#panelG)" stroke="#4a7aaf" stroke-width="1.5"/>
      <line x1="-40" y1="37" x2="50" y2="37" stroke="#3a6a9f" stroke-width=".8"/>
      <line x1="-20" y1="50" x2="-10" y2="-10" stroke="#3a6a9f" stroke-width=".8"/>
      <line x1="20" y1="50" x2="30" y2="-10" stroke="#3a6a9f" stroke-width=".8"/>
      <polygon points="-60,50 60,50 70,-10 -50,-10" fill="rgba(250,204,21,.06)" style="animation:panelGlow 2.3s ease-in-out infinite .4s"/>
      <line x1="0" y1="44" x2="0" y2="124" stroke="#5a7a8a" stroke-width="3" stroke-linecap="round"/>
      <line x1="-18" y1="104" x2="18" y2="104" stroke="#5a7a8a" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- Panel 3 -->
    <g transform="translate(370,226)">
      <polygon points="-60,50 60,50 70,-10 -50,-10" fill="url(#panelG)" stroke="#4a7aaf" stroke-width="1.5"/>
      <line x1="-40" y1="37" x2="50" y2="37" stroke="#3a6a9f" stroke-width=".8"/>
      <line x1="-20" y1="50" x2="-10" y2="-10" stroke="#3a6a9f" stroke-width=".8"/>
      <line x1="20" y1="50" x2="30" y2="-10" stroke="#3a6a9f" stroke-width=".8"/>
      <polygon points="-60,50 60,50 70,-10 -50,-10" fill="rgba(250,204,21,.06)" style="animation:panelGlow 1.9s ease-in-out infinite .8s"/>
      <line x1="0" y1="44" x2="0" y2="118" stroke="#5a7a8a" stroke-width="3" stroke-linecap="round"/>
      <line x1="-18" y1="98" x2="18" y2="98" stroke="#5a7a8a" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- Panel 4 -->
    <g transform="translate(490,222)">
      <polygon points="-60,50 60,50 70,-10 -50,-10" fill="url(#panelG)" stroke="#4a7aaf" stroke-width="1.5"/>
      <line x1="-40" y1="37" x2="50" y2="37" stroke="#3a6a9f" stroke-width=".8"/>
      <line x1="-20" y1="50" x2="-10" y2="-10" stroke="#3a6a9f" stroke-width=".8"/>
      <line x1="20" y1="50" x2="30" y2="-10" stroke="#3a6a9f" stroke-width=".8"/>
      <polygon points="-60,50 60,50 70,-10 -50,-10" fill="rgba(250,204,21,.06)" style="animation:panelGlow 2.1s ease-in-out infinite 1.2s"/>
      <line x1="0" y1="44" x2="0" y2="122" stroke="#5a7a8a" stroke-width="3" stroke-linecap="round"/>
      <line x1="-18" y1="102" x2="18" y2="102" stroke="#5a7a8a" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- DC wires from panels to inverter -->
    <path d="M130,344 L130,390 L380,390" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="8,5">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M250,344 L250,390" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="8,5">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="1.2s" repeatCount="indefinite" begin=".2s"/>
    </path>
    <path d="M370,344 L370,390" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="8,5">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="1.2s" repeatCount="indefinite" begin=".4s"/>
    </path>
    <path d="M490,344 L490,390 L380,390" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="8,5">
      <animate attributeName="stroke-dashoffset" values="0;-52" dur="1.2s" repeatCount="indefinite" begin=".6s"/>
    </path>

    <!-- Inverter box -->
    <rect x="340" y="398" width="80" height="44" rx="8" fill="#1e3a5f" stroke="#4a7aaf" stroke-width="1.5"/>
    <text x="380" y="416" text-anchor="middle" font-size="10" fill="#7dd3fc" font-family="Arial" font-weight="700">INVERTER</text>
    <text x="380" y="432" text-anchor="middle" font-size="9" fill="#60a5fa" font-family="Arial">DC → AC</text>

    <!-- AC output arrow -->
    <g style="animation:arrowRight .9s ease-in-out infinite">
      <line x1="420" y1="420" x2="490" y2="420" stroke="#4ade80" stroke-width="3" marker-end="url(#marG)" stroke-linecap="round"/>
    </g>
    <text x="498" y="416" font-size="10" fill="#4ade80" font-family="Arial" font-weight="700">AC</text>
    <text x="498" y="428" font-size="9" fill="#86efac" font-family="Arial">to grid</text>

    <!-- label -->
    <text x="310" y="466" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="Arial">Photons excite electrons → DC current → Inverter converts to AC</text>
  </svg>
  </div>

  <!-- ════ SCENE 1 : WIND TURBINES ════ -->
  <div class="scene" id="sc1">
  <svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c1428"/><stop offset="100%" stop-color="#1c2e50"/></linearGradient>
      <linearGradient id="gnd1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f2a0f"/><stop offset="100%" stop-color="#081208"/></linearGradient>
      <linearGradient id="towerG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2a3a4a"/><stop offset="50%" stop-color="#5a7a8a"/><stop offset="100%" stop-color="#2a3a4a"/></linearGradient>
      <linearGradient id="bladeG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c8dde8"/><stop offset="100%" stop-color="#7a9ab0"/></linearGradient>
      <marker id="marW" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>

    <!-- sky + ground -->
    <rect width="820" height="480" fill="url(#sky1)"/>
    <rect x="0" y="340" width="820" height="140" fill="url(#gnd1)"/>
    <line x1="0" y1="340" x2="820" y2="340" stroke="#1a3a1a" stroke-width="2"/>

    <!-- distant hills -->
    <ellipse cx="100" cy="360" rx="180" ry="60" fill="#0d200d" opacity=".8"/>
    <ellipse cx="700" cy="365" rx="160" ry="55" fill="#0d200d" opacity=".8"/>

    <!-- wind flow lines (horizontal) -->
    <path d="M10,120 Q200,100 400,130 Q600,160 810,120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="14,8" opacity=".5">
      <animate attributeName="stroke-dashoffset" values="0;-90" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M10,170 Q200,150 400,180 Q600,210 810,170" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="14,8" opacity=".4">
      <animate attributeName="stroke-dashoffset" values="0;-90" dur="2.4s" repeatCount="indefinite" begin=".3s"/>
    </path>
    <path d="M10,220 Q200,205 400,230 Q600,255 810,225" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="12,8" opacity=".3">
      <animate attributeName="stroke-dashoffset" values="0;-80" dur="2.8s" repeatCount="indefinite" begin=".7s"/>
    </path>
    <path d="M10,70 Q200,55 400,80 Q600,105 810,68" fill="none" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="10,8" opacity=".3">
      <animate attributeName="stroke-dashoffset" values="0;-72" dur="1.8s" repeatCount="indefinite" begin=".5s"/>
    </path>

    <!-- clouds drifting -->
    <g style="animation:cloudDrift 9s linear infinite;">
      <ellipse cx="90" cy="54" rx="52" ry="20" fill="rgba(200,230,255,.22)"/>
      <ellipse cx="65" cy="56" rx="34" ry="16" fill="rgba(200,230,255,.22)"/>
      <ellipse cx="116" cy="56" rx="34" ry="16" fill="rgba(200,230,255,.22)"/>
    </g>
    <g style="animation:cloudDrift 12s linear infinite reverse 2s;">
      <ellipse cx="560" cy="70" rx="58" ry="22" fill="rgba(180,220,255,.18)"/>
      <ellipse cx="532" cy="72" rx="38" ry="18" fill="rgba(180,220,255,.18)"/>
      <ellipse cx="588" cy="72" rx="38" ry="18" fill="rgba(180,220,255,.18)"/>
    </g>

    <!-- ── Turbine 1 (large, left) ── -->
    <g transform="translate(230,0)">
      <!-- tower -->
      <polygon points="-12,340 12,340 6,120 -6,120" fill="url(#towerG)"/>
      <!-- nacelle (housing) -->
      <rect x="-18" y="108" width="50" height="22" rx="6" fill="#4a6a7a"/>
      <rect x="-14" y="112" width="42" height="14" rx="4" fill="#3a5a6a"/>
      <!-- spinner hub -->
      <circle cx="10" cy="120" r="10" fill="#5a7a8a" stroke="#7a9aaa" stroke-width="1.5"/>
      <!-- 3 blades rotating FAST -->
      <g style="transform-origin:10px 120px;animation:bladeSpinF 1.4s linear infinite;">
        <!-- blade 1 up -->
        <ellipse cx="10" cy="55" rx="7" ry="65" fill="url(#bladeG)" opacity=".92" transform="rotate(0,10,120)"/>
        <!-- blade 2 lower-right -->
        <ellipse cx="10" cy="55" rx="7" ry="65" fill="url(#bladeG)" opacity=".92" transform="rotate(120,10,120)"/>
        <!-- blade 3 lower-left -->
        <ellipse cx="10" cy="55" rx="7" ry="65" fill="url(#bladeG)" opacity=".92" transform="rotate(240,10,120)"/>
      </g>
      <!-- generator label -->
      <rect x="-22" y="330" width="64" height="20" rx="5" fill="rgba(56,189,248,.14)" stroke="rgba(56,189,248,.35)" stroke-width=".8"/>
      <text x="10" y="344" text-anchor="middle" font-size="9" fill="#7dd3fc" font-family="Arial" font-weight="700">GENERATOR</text>
    </g>

    <!-- ── Turbine 2 (medium, centre-right) ── -->
    <g transform="translate(490,60)">
      <polygon points="-10,280 10,280 5,100 -5,100" fill="url(#towerG)"/>
      <rect x="-15" y="89" width="42" height="19" rx="5" fill="#4a6a7a"/>
      <circle cx="8" cy="100" r="8" fill="#5a7a8a" stroke="#7a9aaa" stroke-width="1.5"/>
      <g style="transform-origin:8px 100px;animation:bladeSpinS 1.8s linear infinite .3s;">
        <ellipse cx="8" cy="48" rx="6" ry="52" fill="url(#bladeG)" opacity=".9" transform="rotate(0,8,100)"/>
        <ellipse cx="8" cy="48" rx="6" ry="52" fill="url(#bladeG)" opacity=".9" transform="rotate(120,8,100)"/>
        <ellipse cx="8" cy="48" rx="6" ry="52" fill="url(#bladeG)" opacity=".9" transform="rotate(240,8,100)"/>
      </g>
    </g>

    <!-- ── Turbine 3 (small, far right) ── -->
    <g transform="translate(680,100)">
      <polygon points="-8,240 8,240 4,90 -4,90" fill="url(#towerG)" opacity=".8"/>
      <rect x="-12" y="80" width="34" height="16" rx="4" fill="#3a5a6a" opacity=".8"/>
      <circle cx="6" cy="90" r="6" fill="#4a6a7a" stroke="#6a8a9a" stroke-width="1"/>
      <g style="transform-origin:6px 90px;animation:bladeSpinF 2.2s linear infinite .6s;">
        <ellipse cx="6" cy="45" rx="5" ry="44" fill="url(#bladeG)" opacity=".8" transform="rotate(0,6,90)"/>
        <ellipse cx="6" cy="45" rx="5" ry="44" fill="url(#bladeG)" opacity=".8" transform="rotate(120,6,90)"/>
        <ellipse cx="6" cy="45" rx="5" ry="44" fill="url(#bladeG)" opacity=".8" transform="rotate(240,6,90)"/>
      </g>
    </g>

    <!-- underground cable from turbines to substation -->
    <path d="M230,390 Q230,430 400,435 Q550,440 580,390" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="10,6">
      <animate attributeName="stroke-dashoffset" values="0;-64" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <!-- substation -->
    <rect x="360" y="355" width="78" height="44" rx="7" fill="#1a2a3a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="399" y="372" text-anchor="middle" font-size="9" fill="#7dd3fc" font-family="Arial" font-weight="700">SUBSTATION</text>
    <text x="399" y="385" text-anchor="middle" font-size="8" fill="#38bdf8" font-family="Arial">Step-up TX</text>
    <line x1="399" y1="399" x2="399" y2="416" stroke="#4ade80" stroke-width="2.5" marker-end="url(#marW)" stroke-linecap="round"/>
    <text x="399" y="430" text-anchor="middle" font-size="9" fill="#4ade80" font-family="Arial" font-weight="700">To grid</text>

    <text x="410" y="468" text-anchor="middle" font-size="11.5" fill="#94a3b8" font-family="Arial">Wind spins blades → Rotor drives generator → AC electricity generated</text>
  </svg>
  </div>

  <!-- ════ SCENE 2 : POWER GRID ════ -->
  <div class="scene" id="sc2">
  <svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg">
    <defs>
