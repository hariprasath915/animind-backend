<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optics Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
:root{
--bg:#0a0c10;--surface:#12151c;--surface2:#1a1f2b;--surface3:#222837;
--border:#2a3040;--border2:#3a4560;
--text:#e8eaf0;--text2:#8892a4;--text3:#556070;
--green:#3ddc84;--green-dim:#003320;
--red:#ff5f57;--red-dim:#3d0000;
--violet:#b57aff;--violet-dim:#1e0040;
--cyan:#00d4d8;--cyan-dim:#003d3e;
--accent:#f5a623;--accent-dim:#3d2800;--accent-glow:rgba(245,166,35,.5);
--panel-w:270px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100%;overflow:hidden}
#app{display:flex;height:100vh}
#sidebar{width:var(--panel-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
#lab-title{padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
#lab-title h1{font-size:16px;font-weight:600;color:var(--text);letter-spacing:-.01em}
#lab-title h1 span{color:var(--accent)}
#exp-list{padding:8px;border-bottom:1px solid var(--border);flex-shrink:0}
.exp-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-weight:500;text-align:left;transition:all .15s}
.exp-btn:hover{background:var(--surface2);color:var(--text)}
.exp-btn.active{background:var(--accent-dim);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.exp-icon{font-size:15px;width:22px;text-align:center;flex-shrink:0}
#controls-panel{flex:1;overflow-y:auto;padding:12px}
#controls-panel::-webkit-scrollbar{width:4px}
#controls-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.ctrl-section{margin-bottom:14px}
.ctrl-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.ctrl-row{margin-bottom:10px}
.ctrl-name{font-size:12px;color:var(--text2);margin-bottom:4px;display:flex;justify-content:space-between}
.ctrl-name span{color:var(--accent);font-weight:600;font-family:monospace}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;border-radius:2px;background:linear-gradient(to right,var(--accent) 0%,var(--accent) calc(var(--pct,50%) * 1%),var(--border2) calc(var(--pct,50%) * 1%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 6px var(--accent-glow)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.toggle-row label{font-size:12px;color:var(--text2)}
.toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--border2);border-radius:10px;cursor:pointer;transition:background .2s}
.toggle input:checked+.toggle-track{background:var(--accent)}
.toggle-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;pointer-events:none}
.toggle input:checked~.toggle-thumb{transform:translateX(16px)}
.btn-row{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;padding:7px 6px;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;text-align:center}
.btn:hover{background:var(--surface3);color:var(--text)}
.btn.primary{background:var(--accent-dim);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{background:var(--accent);color:#000}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#canvas-area{flex:1;position:relative;overflow:hidden}
#canvas-area canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#overlay-bar{position:absolute;top:10px;right:12px;display:flex;gap:6px;z-index:10}
.ov-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;transition:all .15s;user-select:none}
.ov-btn:hover,.ov-btn.on{background:var(--surface3);color:var(--accent);border-color:var(--accent-dim)}
#tip{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:11px;padding:6px 14px;border-radius:20px;pointer-events:none;white-space:nowrap;z-index:10}
#info-panel{height:96px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0}
.metric{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 14px;border-right:1px solid var(--border);min-width:0}
.metric:last-child{border-right:none}
.metric-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:3px;white-space:nowrap}
.metric-value{font-size:18px;font-weight:600;font-family:monospace;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-sub{font-size:10px;color:var(--text2);margin-top:2px}
.metric-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;margin-top:3px}
.badge-green{background:var(--green-dim);color:var(--green)}
.badge-red{background:var(--red-dim);color:var(--red)}
.badge-amber{background:var(--accent-dim);color:var(--accent)}
.badge-violet{background:var(--violet-dim);color:var(--violet)}
@media(max-width:760px){
#app{flex-direction:column}
#sidebar{width:100%;max-height:220px;overflow-y:auto;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--border)}
#lab-title{flex-shrink:0;border-bottom:none;border-right:1px solid var(--border)}
#exp-list{display:flex;flex-wrap:wrap;border-bottom:none;border-right:1px solid var(--border);padding:4px}
.exp-btn{width:auto;padding:5px 8px}
#controls-panel{display:flex;flex-wrap:wrap;gap:8px;flex-direction:row;align-items:flex-start;flex:1}
.ctrl-section{margin-bottom:0;min-width:120px}
#info-panel{height:auto;flex-wrap:wrap}
.metric{min-width:80px;flex:1 1 80px}
}
</style>
</head>
<body>
<div id="app">
<div id="sidebar">
<div id="lab-title">
<div class="eyebrow">Interactive Simulation</div>
<h1>Optics <span>Lab</span></h1>
</div>
<div id="exp-list">
<button class="exp-btn active" onclick="switchExp(0)">
<span class="exp-icon">🔀</span>Snell's Law
</button>
<button class="exp-btn" onclick="switchExp(1)">
<span class="exp-icon">🔵</span>Convex Lens
</button>
<button class="exp-btn" onclick="switchExp(2)">
<span class="exp-icon">🔴</span>Concave Lens
</button>
<button class="exp-btn" onclick="switchExp(3)">
<span class="exp-icon">🪞</span>Concave Mirror
</button>
<button class="exp-btn" onclick="switchExp(4)">
<span class="exp-icon">〰</span>Double-Slit
</button>
<button class="exp-btn" onclick="switchExp(5)">
<span class="exp-icon">🌊</span>Single-Slit
</button>
</div>
<div id="controls-panel"></div>
</div>
<div id="main">
<div id="canvas-area">
<canvas id="cvs"></canvas>
<div id="overlay-bar">
<button class="ov-btn" id="btnNormal" onclick="toggleOv('normal')" title="Normal line">Normal</button>
<button class="ov-btn on" id="btnArcs" onclick="toggleOv('arcs')" title="Angle arcs">Arcs</button>
<button class="ov-btn on" id="btnLabels" onclick="toggleOv('labels')" title="Ray labels">Labels</button>
<button class="ov-btn" id="btnReset" onclick="resetSim()">↺ Reset</button>
</div>
<div id="tip">Drag on canvas to adjust angle · Space=reset</div>
</div>
<div id="info-panel"></div>
</div>
</div>
<script>
/* -- SimEngine Error Boundary -- */
try {

const cvs=document.getElementById('cvs');
const ctx=cvs.getContext('2d');
let W=800,H=500;
let expIdx=0;
let showNormal=false,showArcs=true,showLabels=true;

const OV={normal:false,arcs:true,labels:true};

function toggleOv(k){
OV[k]=!OV[k];
document.getElementById('btn'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('on',OV[k]);
draw();
}

// CSS var helpers
function cssv(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

// DPR-aware resize
function resizeCanvas(){
const dpr=window.devicePixelRatio||1;
const r=cvs.getBoundingClientRect();
cvs.width=r.width*dpr;
cvs.height=r.height*dpr;
ctx.setTransform(1,0,0,1,0,0);
ctx.scale(dpr,dpr);
W=r.width;H=r.height;
draw();
}
window.addEventListener('resize',resizeCanvas);

// Slider state
const state={
wavelength:550,
theta1:40,
n2:1.5,
focal:120,
dobject:200,
slitSep:0.1,
slitWidth:0.04,
slitDist:500,
};

// Wavelength to RGB
function wlToRGB(wl){
let r,g,b;
if(wl>=380&&wl<440){r=(440-wl)/(440-380);g=0;b=1;}
else if(wl<490){r=0;g=(wl-440)/(490-440);b=1;}
else if(wl<510){r=0;g=1;b=(510-wl)/(510-490);}
else if(wl<580){r=(wl-510)/(580-510);g=1;b=0;}
else if(wl<645){r=1;g=(645-wl)/(645-580);b=0;}
else if(wl<=780){r=1;g=0;b=0;}
else{r=0;g=0;b=0;}
let a=1;
if(wl<420)a=0.3+0.7*(wl-380)/40;
else if(wl>700)a=0.3+0.7*(780-wl)/80;
const ri=Math.round(r*255),gi=Math.round(g*255),bi=Math.round(b*255);
return{r:ri,g:gi,b:bi,a,css:`rgba(${ri},${gi},${bi},${a.toFixed(2)})`,glow:`rgba(${ri},${gi},${bi},0.4)`};
}

// Controls per experiment
const expControls=[
// 0: Snell
`<div class="ctrl-section">
<div class="ctrl-label">Light Source</div>
<div class="ctrl-row"><div class="ctrl-name">Wavelength<span id="dWl">550 nm</span></div>
<input type="range" id="sWl" min="380" max="780" value="550"></div>
<div class="ctrl-row"><div class="ctrl-name">Incident angle θ₁<span id="dTheta">40°</span></div>
<input type="range" id="sTheta" min="1" max="89" value="40"></div>
</div>
<div class="ctrl-section">
<div class="ctrl-label">Medium</div>
<div class="ctrl-row"><div class="ctrl-name">n₁ (top)<span id="dN1">1.00</span></div>
<input type="range" id="sN1" min="100" max="250" value="100" step="1"></div>
<div class="ctrl-row"><div class="ctrl-name">n₂ (bottom)<span id="dN2">1.50</span></div>
<input type="range" id="sN2" min="100" max="250" value="150" step="1"></div>
</div>`,
// 1: Convex lens
`<div class="ctrl-section">
<div class="ctrl-label">Light Source</div>
<div class="ctrl-row"><div class="ctrl-name">Wavelength<span id="dWl">550 nm</span></div>
<input type="range" id="sWl" min="380" max="780" value="550"></div>
</div>
<div class="ctrl-section">
<div class="ctrl-label">Convex Lens</div>
<div class="ctrl-row"><div class="ctrl-name">Focal length f<span id="dFocal">120 px</span></div>
<input type="range" id="sFocal" min="40" max="220" value="120"></div>
<div class="ctrl-row"><div class="ctrl-name">Object distance dₒ<span id="dDobj">200 px</span></div>
<input type="range" id="sDobj" min="20" max="400" value="200"></div>
</div>`,
// 2: Concave lens
`<div class="ctrl-section">
<div class="ctrl-label">Light Source</div>
<div class="ctrl-row"><div class="ctrl-name">Wavelength<span id="dWl">550 nm</span></div>
<input type="range" id="sWl" min="380" max="780" value="550"></div>
</div>
<div class="ctrl-section">
<div class="ctrl-label">Concave Lens</div>
<div class="ctrl-row"><div class="ctrl-name">Focal length |f|<span id="dFocal">120 px</span></div>
<input type="range" id="sFocal" min="40" max="220" value="120"></div>
<div class="ctrl-row"><div class="ctrl-name">Object distance dₒ<span id="dDobj">200 px</span></div>
<input type="range" id="sDobj" min="20" max="400" value="200"></div>
</div>`,
// 3: Concave mirror
`<div class="ctrl-section">
<div class="ctrl-label">Light Source</div>
<div class="ctrl-row"><div class="ctrl-name">Wavelength<span id="dWl">550 nm</span></div>
<input type="range" id="sWl" min="380" max="780" value="550"></div>
</div>
<div class="ctrl-section">
<div class="ctrl-label">Concave Mirror</div>
<div class="ctrl-row"><div class="ctrl-name">Focal length f<span id="dFocal">120 px</span></div>
<input type="range" id="sFocal" min="40" max="220" value="120"></div>
<div class="ctrl-row"><div class="ctrl-name">Object distance dₒ<span id="dDobj">200 px</span></div>
<input type="range" id="sDobj" min="20" max="400" value="200"></div>
</div>`,
// 4: Double-slit
`<div class="ctrl-section">
<div class="ctrl-label">Light Source</div>
<div class="ctrl-row"><div class="ctrl-name">Wavelength<span id="dWl">550 nm</span></div>
<input type="range" id="sWl" min="380" max="780" value="550"></div>
</div>
<div class="ctrl-section">
<div class="ctrl-label">Double Slit</div>
<div class="ctrl-row"><div class="ctrl-name">Slit sep. d (mm)<span id="dSep">0.100</span></div>
<input type="range" id="sSep" min="20" max="500" value="100" step="1"></div>
<div class="ctrl-row"><div class="ctrl-name">Screen dist. L (mm)<span id="dDist">500</span></div>
<input type="range" id="sDist" min="100" max="2000" value="500" step="10"></div>
</div>`,
// 5: Single-slit
`<div class="ctrl-section">
<div class="ctrl-label">Light Source</div>
<div class="ctrl-row"><div class="ctrl-name">Wavelength<span id="dWl">550 nm</span></div>
<input type="range" id="sWl" min="380" max="780" value="550"></div>
</div>
<div class="ctrl-section">
<div class="ctrl-label">Single Slit</div>
<div class="ctrl-row"><div class="ctrl-name">Slit width a (mm)<span id="dSlit">0.040</span></div>
<input type="range" id="sSlit" min="10" max="300" value="40" step="1"></div>
<div class="ctrl-row"><div class="ctrl-name">Screen dist. L (mm)<span id="dDist">500</span></div>
<input type="range" id="sDist" min="100" max="2000" value="500" step="10"></div>
</div>`,
];

function gv(id){const el=document.getElementById(id);return el?parseFloat(el.value):0;}
function setSliderPct(id){
const el=document.getElementById(id);
if(!el)return;
const v=parseFloat(el.value),mn=parseFloat(el.min),mx=parseFloat(el.max);
el.style.setProperty('--pct',(100*(v-mn)/(mx-mn)).toFixed(1));
}
function setText(id,txt){const el=document.getElementById(id);if(el)el.textContent=txt;}

function bindControls(){
const cp=document.getElementById('controls-panel');
cp.innerHTML=expControls[expIdx];

// wavelength
const sWl=document.getElementById('sWl');
if(sWl){
sWl.value=state.wavelength;
sWl.addEventListener('input',()=>{state.wavelength=parseFloat(sWl.value);setText('dWl',state.wavelength+' nm');setSliderPct('sWl');draw();});
setSliderPct('sWl');setText('dWl',state.wavelength+' nm');
}
// theta
const sTheta=document.getElementById('sTheta');
if(sTheta){
sTheta.value=state.theta1;
sTheta.addEventListener('input',()=>{state.theta1=parseFloat(sTheta.value);setText('dTheta',state.theta1+'°');setSliderPct('sTheta');draw();});
setSliderPct('sTheta');setText('dTheta',state.theta1+'°');
}
// n1
const sN1=document.getElementById('sN1');
if(sN1){
sN1.value=Math.round(state.n1*100)||100;
sN1.addEventListener('input',()=>{state.n1=parseFloat(sN1.value)/100;setText('dN1',state.n1.toFixed(2));setSliderPct('sN1');draw();});
setSliderPct('sN1');setText('dN1',(state.n1||1).toFixed(2));
}
// n2
const sN2=document.getElementById('sN2');
if(sN2){
sN2.value=Math.round((state.n2||1.5)*100);
sN2.addEventListener('input',()=>{state.n2=parseFloat(sN2.value)/100;setText('dN2',state.n2.toFixed(2));setSliderPct('sN2');draw();});
setSliderPct('sN2');setText('dN2',state.n2.toFixed(2));
}
// focal
const sFocal=document.getElementById('sFocal');
if(sFocal){
sFocal.value=state.focal;
sFocal.addEventListener('input',()=>{state.focal=parseFloat(sFocal.value);setText('dFocal',state.focal+' px');setSliderPct('sFocal');draw();});
setSliderPct('sFocal');setText('dFocal',state.focal+' px');
}
// dobj
const sDobj=document.getElementById('sDobj');
if(sDobj){
sDobj.value=state.dobject;
sDobj.addEventListener('input',()=>{state.dobject=parseFloat(sDobj.value);setText('dDobj',state.dobject+' px');setSliderPct('sDobj');draw();});
setSliderPct('sDobj');setText('dDobj',state.dobject+' px');
}
// slit sep
const sSep=document.getElementById('sSep');
if(sSep){
sSep.value=Math.round(state.slitSep*1000);
sSep.addEventListener('input',()=>{state.slitSep=parseFloat(sSep.value)/1000;setText('dSep',state.slitSep.toFixed(3));setSliderPct('sSep');draw();});
setSliderPct('sSep');setText('dSep',state.slitSep.toFixed(3));
}
// slit width
const sSlit=document.getElementById('sSlit');
if(sSlit){
sSlit.value=Math.round(state.slitWidth*1000);
sSlit.addEventListener('input',()=>{state.slitWidth=parseFloat(sSlit.value)/1000;setText('dSlit',state.slitWidth.toFixed(3));setSliderPct('sSlit');draw();});
setSliderPct('sSlit');setText('dSlit',state.slitWidth.toFixed(3));
}
// screen dist
const sDist=document.getElementById('sDist');
if(sDist){
sDist.value=state.slitDist;
sDist.addEventListener('input',()=>{state.slitDist=parseFloat(sDist.value);setText('dDist',state.slitDist.toFixed(0));setSliderPct('sDist');draw();});
setSliderPct('sDist');setText('dDist',state.slitDist.toFixed(0));
}
}

if(!state.n1) state.n1=1.0;

function switchExp(i){
expIdx=i;
document.querySelectorAll('.exp-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
bindControls();
draw();
}

// ── DRAWING HELPERS ─────────────────────────────────────────────
function arrow(x1,y1,x2,y2,col,lw){
ctx.save();
ctx.strokeStyle=col;ctx.lineWidth=lw||2;
ctx.shadowColor=col;ctx.shadowBlur=8;
ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
const ang=Math.atan2(y2-y1,x2-x1);
const hs=10*((lw||2)/2+0.5);
ctx.beginPath();
ctx.moveTo(x2,y2);
ctx.lineTo(x2-hs*Math.cos(ang-0.35),y2-hs*Math.sin(ang-0.35));
ctx.lineTo(x2-hs*Math.cos(ang+0.35),y2-hs*Math.sin(ang+0.35));
ctx.closePath();ctx.fillStyle=col;ctx.shadowBlur=0;ctx.fill();
ctx.shadowBlur=0;ctx.restore();
}
function dashLine(x1,y1,x2,y2,col){
ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1;
ctx.setLineDash([6,4]);ctx.beginPath();
ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
ctx.setLineDash([]);ctx.restore();
}
function glowLine(x1,y1,x2,y2,col,lw,blur){
ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw||2;
ctx.shadowColor=col;ctx.shadowBlur=blur||10;
ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
ctx.shadowBlur=0;ctx.restore();
}
function label(x,y,txt,col,bg,fs){
ctx.save();ctx.font=`${fs||12}px monospace`;
if(bg){const m=ctx.measureText(txt);const pw=4,ph=3;
ctx.fillStyle=bg;
ctx.fillRect(x-pw,y-(fs||12)-ph+2,m.width+pw*2,(fs||12)+ph*2);}
ctx.fillStyle=col||'#fff';ctx.fillText(txt,x,y);ctx.restore();
}
function arcAngle(cx,cy,r,a1,a2,col){
ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.5;
ctx.beginPath();ctx.arc(cx,cy,r,a1,a2);ctx.stroke();ctx.restore();
}

function setMetrics(items){
const panel=document.getElementById('info-panel');
panel.innerHTML=items.map(m=>`
<div class="metric">
<div class="metric-label">${m.label}</div>
<div class="metric-value">${m.value}</div>
${m.sub?`<div class="metric-sub">${m.sub}</div>`:''}
${m.badge?`<div class="metric-badge ${m.badgeClass||'badge-amber'}">${m.badge}</div>`:''}
</div>`).join('');
}

// ── EXPERIMENT DRAWS ────────────────────────────────────────────
function drawSnell(){
const wl=state.wavelength;
const n1=state.n1||1.0;
const n2=state.n2||1.5;
const t1=state.theta1*Math.PI/180;
const col=wlToRGB(wl);
const bcol=cssv('--border2');

const cx=W/2, cy=H/2;

// Interface
ctx.save();ctx.strokeStyle=bcol;ctx.lineWidth=1.5;
ctx.setLineDash([8,4]);
ctx.beginPath();ctx.moveTo(40,cy);ctx.lineTo(W-40,cy);ctx.stroke();
ctx.setLineDash([]);ctx.restore();

// Medium labels
ctx.save();
ctx.fillStyle='rgba(0,212,216,0.08)';
ctx.fillRect(0,0,W,cy);
ctx.fillStyle='rgba(181,122,255,0.06)';
ctx.fillRect(0,cy,W,H-cy);
ctx.restore();
label(50,30,'n₁ = '+n1.toFixed(2),cssv('--cyan'),'',13);
label(50,cy+22,'n₂ = '+n2.toFixed(2),cssv('--violet'),'',13);

// Normal line
if(OV.normal){
dashLine(cx,cy-H*0.42,cx,cy+H*0.42,cssv('--text3'));
label(cx+4,cy-H*0.38,'Normal',cssv('--text3'),'',10);
}

// Incident ray
const rayLen=Math.min(cy-20,200);
const ix=cx-Math.sin(t1)*rayLen;
const iy=cy-Math.cos(t1)*rayLen;
glowLine(ix,iy,cx,cy,col.css,2.5,12);
arrow(ix+(cx-ix)*0.5,iy+(cy-iy)*0.5,cx,cy,col.css,2);

// Refracted ray
const sinT2=n1*Math.sin(t1)/n2;
let theta2=null,tir=false;
if(Math.abs(sinT2)<=1){
theta2=Math.asin(sinT2);
const rx=cx+Math.sin(theta2)*rayLen*1.3;
const ry=cy+Math.cos(theta2)*rayLen*1.3;
glowLine(cx,cy,rx,ry,col.css,2.5,12);
arrow(cx+(rx-cx)*0.5,cy+(ry-cy)*0.5,rx,ry,col.css,2);
if(OV.arcs){
arcAngle(cx,cy,55,Math.PI/2,Math.PI/2+theta2,cssv('--violet'));
if(OV.labels) label(cx+60,cy+28,'θ₂='+( theta2*180/Math.PI).toFixed(1)+'°',cssv('--violet'),'',11);
}
}else{
tir=true;
// TIR reflected ray
const rx=cx+Math.sin(t1)*rayLen*1.3;
const ry=cy-Math.cos(t1)*rayLen*1.3;
glowLine(cx,cy,rx,ry,col.css,2.5,14);
arrow(cx+(rx-cx)*0.5,cy+(ry-cy)*0.5,rx,ry,col.css,2);
if(OV.labels) label(cx+30,cy-30,'TIR',cssv('--red'),'',13);
}

// Angle arcs for incident
if(OV.arcs){
arcAngle(cx,cy,45,-Math.PI/2,-Math.PI/2+t1,cssv('--cyan'));
if(OV.labels) label(cx-60,cy-32,'θ₁='+state.theta1+'°',cssv('--cyan'),'',11);
}

// Critical angle
const critRad=(n1>n2)?Math.asin(n2/n1):null;
const critDeg=critRad?critRad*180/Math.PI:null;

setMetrics([
{label:'θ₁ Incident',value:state.theta1+'°',sub:'top medium'},
{label:'θ₂ Refracted',value:tir?'TIR':(theta2*180/Math.PI).toFixed(2)+'°',sub:tir?'total reflection':'bottom medium',badge:tir?'TIR':null,badgeClass:'badge-red'},
{label:'n₁ / n₂',value:n1.toFixed(2)+' / '+n2.toFixed(2),sub:'refractive indices'},
{label:'Critical Angle',value:critDeg?critDeg.toFixed(2)+'°':'N/A',sub:n1>n2?'n₁>n₂':'n₁≤n₂',badge:critDeg&&state.theta1>=critDeg?'TIR ACTIVE':null,badgeClass:'badge-red'},
{label:'Wavelength',value:state.wavelength+' nm',sub:wlName(state.wavelength)},
]);
}

function wlName(wl){
if(wl<380)return'UV';
if(wl<440)return'Violet';
if(wl<490)return'Blue';
if(wl<510)return'Cyan';
if(wl<580)return'Green';
if(wl<645)return'Yellow/Orange';
if(wl<=780)return'Red';
return'IR';
}

function drawLens(convex){
const f=convex?state.focal:-state.focal;
const do_=state.dobject;
const wl=state.wavelength;
const col=wlToRGB(wl);

const ox=W*0.18, cy=H*0.5, lx=W*0.5;
const scale=1;

// Lens
const lh=Math.min(H*0.45,160);
const lc=cssv('--border2');
ctx.save();
ctx.strokeStyle=convex?cssv('--accent'):cssv('--violet');
ctx.lineWidth=2.5;
if(convex){
// double convex shape
ctx.beginPath();
ctx.moveTo(lx,cy-lh);
ctx.bezierCurveTo(lx+28,cy-lh/2,lx+28,cy+lh/2,lx,cy+lh);
ctx.bezierCurveTo(lx-28,cy+lh/2,lx-28,cy-lh/2,lx,cy-lh);
}else{
// double concave
ctx.beginPath();
ctx.moveTo(lx,cy-lh);
ctx.bezierCurveTo(lx-22,cy-lh/2,lx-22,cy+lh/2,lx,cy+lh);
ctx.bezierCurveTo(lx+22,cy+lh/2,lx+22,cy-lh/2,lx,cy-lh);
}
ctx.stroke();
// Principal axis
ctx.strokeStyle=lc;ctx.lineWidth=1;ctx.setLineDash([6,4]);
ctx.beginPath();ctx.moveTo(30,cy);ctx.lineTo(W-30,cy);ctx.stroke();
ctx.setLineDash([]);
ctx.restore();

// Object
const objX=lx-do_;
const objH=50;
if(objX>30&&objX<lx-4){
arrow(objX,cy,objX,cy-objH,cssv('--green'),2.5);
if(OV.labels) label(objX+4,cy-objH-6,'Object',cssv('--green'),'',11);
}

// Image calculation
// 1/f = 1/do + 1/di => di = do*f/(do-f)
const di_=do_===f?Infinity:(do_*f)/(do_-f);
const M=isFinite(di_)?-di_/do_:NaN;

const imgX=lx+di_;
const imgH=isFinite(M)?objH*Math.abs(M):0;
const imgInv=isFinite(M)?M<0:false;
const imgVirt=isFinite(di_)&&di_<0;

if(isFinite(di_)&&Math.abs(di_)<W*2){
const ix2=lx+di_;
if(ix2>30&&ix2<W-30){
const c2=imgVirt?cssv('--cyan'):cssv('--red');
arrow(ix2,cy,ix2,cy-(imgInv?-imgH:imgH),c2,2);
if(OV.labels) label(ix2+4,cy-Math.abs(imgH)*0.5,imgVirt?'Virtual':'Real',c2,'',10);
}
}

// Ray 1: parallel to axis then through f
const r1y=cy-objH;
// draw from object to lens
glowLine(objX,r1y,lx,r1y,col.css,1.8,8);
// after lens: through f
if(convex){
// converges to focal point on other side
const fpt={x:lx+f,y:cy};
if(isFinite(di_)&&Math.abs(di_)<W*3){
// goes to image top
const slope=(cy-(imgInv?-imgH:imgH)-r1y)/(imgX-lx);
const endX=imgVirt?lx-60:Math.min(W-10,imgX+20);
glowLine(lx,r1y,endX,r1y+(endX-lx)*slope,col.css,1.8,8);
if(imgVirt){
// dashed extension
dashLine(lx,r1y,Math.max(20,imgX),cy-(imgInv?-imgH:imgH),cssv('--cyan'));
}
}
}else{
// diverges away from near focal
const slope=(r1y-cy)/(lx-(lx+f));
const endX=W-10;
glowLine(lx,r1y,endX,r1y+(endX-lx)*slope,col.css,1.8,8);
dashLine(lx,r1y,lx+80,(r1y-(lx-(lx+f))*slope*0.6),cssv('--cyan'));
}

// Ray 2: through center
if(Math.abs(objX-lx)>2){
const slope2=(cy-objH-cy)/(objX-lx);
const endX2=Math.min(W-10,lx+(imgVirt?-(lx-objX)*0.5:(W-lx-10)));
glowLine(objX,cy-objH,endX2,cy+(endX2-lx)*(-slope2)*(lx-objX<0?1:1),col.css,1.8,8);
}

// Focal marks
const fc=convex?cssv('--accent'):cssv('--violet');
if(convex){
ctx.save();ctx.fillStyle=fc;ctx.beginPath();ctx.arc(lx+f,cy,5,0,Math.PI*2);ctx.fill();ctx.restore();
ctx.save();ctx.fillStyle=fc;ctx.beginPath();ctx.arc(lx-f,cy,5,0,Math.PI*2);ctx.fill();ctx.restore();
if(OV.labels){label(lx+f+6,cy-12,'F',fc,'',11);label(lx-f+6,cy-12,'F',fc,'',11);}
}else{
ctx.save();ctx.fillStyle=fc;ctx.beginPath();ctx.arc(lx+f,cy,5,0,Math.PI*2);ctx.fill();ctx.restore();
ctx.save();ctx.fillStyle=fc;ctx.beginPath();ctx.arc(lx-f,cy,5,0,Math.PI*2);ctx.fill();ctx.restore();
if(OV.labels){label(lx+f+6,cy-12,'F',fc,'',11);label(lx-f+6,cy-12,'F',fc,'',11);}
}

const diLabel=isFinite(di_)?di_.toFixed(1)+' px':'∞';
const mLabel=isFinite(M)?M.toFixed(3):'∞';

setMetrics([
{label:'Object dist dₒ',value:do_+' px'},
{label:'Image dist dᵢ',value:diLabel,sub:isFinite(di_)&&di_<0?'virtual image':isFinite(di_)?'real image':'at ∞',badge:isFinite(di_)&&di_<0?'Virtual':null,badgeClass:'badge-violet'},
{label:'Magnification M',value:isFinite(M)?M.toFixed(3):'∞',sub:isFinite(M)&&M<0?'inverted':isFinite(M)?'upright':'—'},
{label:'Focal Length f',value:(convex?'+':'-')+state.focal+' px'},
{label:'Wavelength',value:state.wavelength+' nm',sub:wlName(state.wavelength)},
]);
}

function drawMirror(){
const f=state.focal;
const do_=state.dobject;
const wl=state.wavelength;
const col=wlToRGB(wl);

const mx=W*0.75, cy=H*0.5;
const mh=Math.min(H*0.45,160);

// Mirror arc
const rad=f*2;
ctx.save();
ctx.strokeStyle=cssv('--accent');
ctx.lineWidth=3;
ctx.shadowColor=cssv('--accent');ctx.shadowBlur=8;
ctx.beginPath();
const ht=Math.asin(Math.min(mh/rad,0.99));
ctx.arc(mx+rad,cy,rad,Math.PI-ht,Math.PI+ht);
ctx.stroke();
ctx.restore();

// reflective surface shading
ctx.save();
const grad=ctx.createLinearGradient(mx-5,cy-mh,mx+15,cy+mh);
grad.addColorStop(0,'rgba(245,166,35,0.00)');
grad.addColorStop(0.5,'rgba(245,166,35,0.08)');
grad.addColorStop(1,'rgba(245,166,35,0.00)');
ctx.fillStyle=grad;
ctx.fillRect(mx-30,cy-mh,50,mh*2);
ctx.restore();

// Principal axis
dashLine(10,cy,W-20,cy,cssv('--border2'));

// Object
const objX=mx-do_;
const objH=50;
if(objX>20&&objX<mx-5){
arrow(objX,cy,objX,cy-objH,cssv('--green'),2.5);
if(OV.labels) label(objX+4,cy-objH-6,'Object',cssv('--green'),'',11);
}

// Image via mirror eq: 1/f=1/do+1/di
const di_=(do_===f)?Infinity:(do_*f)/(do_-f);
const M=isFinite(di_)?-di_/do_:NaN;
const imgX=mx-di_; // real image same side
const imgH=isFinite(M)?objH*Math.abs(M):0;
const imgInv=isFinite(M)&&M<0;

if(isFinite(di_)&&Math.abs(di_)<W*1.5){
const ivirt=di_<0;
const ic=ivirt?cssv('--cyan'):cssv('--red');
const ix=mx-di_;
if(ix>10&&ix<W-10){
arrow(ix,cy,ix,cy-(imgInv?imgH:-imgH),ic,2);
if(OV.labels) label(ix+4,cy-Math.abs(imgH)*0.5-14,ivirt?'Virtual':'Real',ic,'',10);
}
}

// Focal and center of curvature
const fc=cssv('--accent');
ctx.save();
ctx.fillStyle=fc;
ctx.beginPath();ctx.arc(mx-f,cy,5,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(mx-2*f,cy,4,0,Math.PI*2);ctx.fill();
ctx.restore();
if(OV.labels){label(mx-f+4,cy-14,'F',fc,'',11);label(mx-2*f+4,cy-14,'C',fc,'',11);}

// Ray 1: parallel to axis, reflects through F
const r1startX=objX, r1Y=cy-objH;
glowLine(r1startX,r1Y,mx,r1Y,col.css,1.8,8);
// reflected ray direction: goes through F
if(mx>0){
const slope=(r1Y-cy)/((mx)-(mx-f));
const endX2=10;
glowLine(mx,r1Y,endX2,r1Y+(endX2-mx)*slope,col.css,1.8,8);
}

// Ray 2: through center, reflects back through center
if(objX>10){
const slope2=(r1Y-cy)/(objX-mx);
glowLine(objX,r1Y,mx,cy+(mx-objX)*slope2,col.css,1.8,8);
glowLine(mx,cy+(mx-objX)*slope2,10,cy+(mx-objX)*slope2+(mx-10)*slope2,col.css,1.8,8);
}

const diLabel=isFinite(di_)?di_.toFixed(1)+' px':'∞';
const mLabel=isFinite(M)?M.toFixed(3):'∞';

setMetrics([
{label:'Object dist dₒ',value:do_+' px'},
{label:'Image dist dᵢ',value:diLabel,sub:isFinite(di_)&&di_<0?'virtual image':isFinite(di_)?'real image':'at ∞',badge:isFinite(di_)&&di_<0?'Virtual':null,badgeClass:'badge-violet'},
{label:'Magnification M',value:isFinite(M)?M.toFixed(3):'∞',sub:isFinite(M)&&M<0?'inverted':isFinite(M)?'upright':'—'},
{label:'Focal Length f',value:'+'+state.focal+' px',sub:'concave mirror'},
{label:'Wavelength',value:state.wavelength+' nm',sub:wlName(state.wavelength)},
]);
}

function drawDoublesSlit(){
const wl_nm=state.wavelength; // nm
const wl=wl_nm*1e-9; // m
const d=state.slitSep*1e-3; // m
const L=state.slitDist*1e-3; // m
const col=wlToRGB(wl_nm);

// fringe spacing (m) = lambda*L/d
const fringeSpacing=wl*L/d; // m
// convert to pixels: let 1 mm on screen = 6px (scale)
const mmToPx=4.0;
const fringePx=fringeSpacing*1e3*mmToPx;

// Draw barrier and slits
const bx=W*0.2, sx=W*0.8;
const cy=H*0.5;
const gap=12, barrierH=H*0.45;
const slitOffset=22;

// incoming rays
const nRays=7;
for(let i=0;i<nRays;i++){
const y=cy-barrierH+i*(2*barrierH/(nRays-1));
glowLine(20,y,bx-1,y,col.css,1,4);
}

// barrier
ctx.save();
ctx.fillStyle=cssv('--surface3');
ctx.strokeStyle=cssv('--border2');ctx.lineWidth=1.5;
ctx.fillRect(bx-4,cy-barrierH,8,barrierH-slitOffset-gap/2);
ctx.fillRect(bx-4,cy-slitOffset+gap/2,8,2*(slitOffset-gap/2));
ctx.fillRect(bx-4,cy+slitOffset+gap/2,8,barrierH-slitOffset-gap/2);
ctx.strokeRect(bx-4,cy-barrierH,8,barrierH-slitOffset-gap/2);
ctx.strokeRect(bx-4,cy-slitOffset+gap/2,8,2*(slitOffset-gap/2));
ctx.strokeRect(bx-4,cy+slitOffset+gap/2,8,barrierH-slitOffset-gap/2);
ctx.restore();

if(OV.labels){label(bx-28,cy-barrierH+10,'Barrier',cssv('--text3'),'',10);}

// Screen
ctx.save();
ctx.strokeStyle=cssv('--border2');ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(sx,cy-barrierH);ctx.lineTo(sx,cy+barrierH);ctx.stroke();
ctx.restore();
if(OV.labels) label(sx+4,cy-barrierH+10,'Screen',cssv('--text3'),'',10);

// Diffraction pattern on screen
const scH=barrierH*2;
const imgData=ctx.createImageData(12,Math.round(scH));
for(let py=0;py<Math.round(scH);py++){
const y_pos=(py-scH/2); // px from center
const y_m=y_pos/(mmToPx*1000); // m
const theta=Math.atan2(y_m,L);
const delta=d*Math.sin(theta)/wl; // path diff in wavelengths
const I=Math.cos(Math.PI*delta)**2;
const rgba=wlToRGB(wl_nm);
const idx=py*4*12;
for(let px=0;px<12;px++){
imgData.data[idx+px*4]=rgba.r;
imgData.data[idx+px*4+1]=rgba.g;
imgData.data[idx+px*4+2]=rgba.b;
imgData.data[idx+px*4+3]=Math.round(I*255*rgba.a);
}
}
ctx.putImageData(imgData,sx,Math.round(cy-scH/2));

// Rays from slits to bright fringes
const slit1={x:bx,y:cy-slitOffset};
const slit2={x:bx,y:cy+slitOffset};
const maxOrder=Math.floor((barrierH)/(fringePx||1));
for(let m=-Math.min(maxOrder,8);m<=Math.min(maxOrder,8);m++){
const fy=cy+m*fringePx;
if(fy<cy-barrierH||fy>cy+barrierH) continue;
const alpha=m===0?0.7:0.3;
ctx.save();
ctx.strokeStyle=col.css.replace(/,[^,]+\)/,`,${alpha})`);
ctx.lineWidth=m===0?1.5:0.8;
ctx.setLineDash(m===0?[]:[4,4]);
ctx.beginPath();ctx.moveTo(slit1.x,slit1.y);ctx.lineTo(sx,fy);ctx.stroke();
ctx.beginPath();ctx.moveTo(slit2.x,slit2.y);ctx.lineTo(sx,fy);ctx.stroke();
ctx.setLineDash([]);ctx.restore();
if(OV.labels&&m>=0&&m<=2){
label(sx+14,fy+4,'m='+m,cssv('--text2'),'',10);
}
}

// fringe spacing annotation
if(fringePx>15&&fringePx<barrierH){
const ay=cy-fringePx, ay2=cy;
dashLine(sx+30,ay,sx+30,ay2,cssv('--text3'));
ctx.save();
ctx.strokeStyle=cssv('--text3');ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(sx+26,ay);ctx.lineTo(sx+34,ay);ctx.stroke();
ctx.beginPath();ctx.moveTo(sx+26,ay2);ctx.lineTo(sx+34,ay2);ctx.stroke();
ctx.restore();
label(sx+36,cy-fringePx/2+4,'Δy='+(fringeSpacing*1e3).toFixed(2)+'mm',cssv('--text2'),'',10);
}

setMetrics([
{label:'Wavelength λ',value:wl_nm+' nm',sub:wlName(wl_nm)},
{label:'Slit Sep. d',value:(d*1e3).toFixed(3)+' mm'},
{label:'Screen Dist L',value:(L*1000).toFixed(0)+' mm'},
{label:'Fringe Spacing',value:(fringeSpacing*1e3).toFixed(3)+' mm',sub:'Δy = λL/d'},
{label:'1st-order angle',value:(Math.asin(wl/d)*180/Math.PI).toFixed(3)+'°',sub:'sinθ = λ/d'},
]);
}

function drawSingleSlit(){
const wl_nm=state.wavelength;
const wl=wl_nm*1e-9;
const a=state.slitWidth*1e-3;
const L=state.slitDist*1e-3;
const col=wlToRGB(wl_nm);
const mmToPx=4.0;

const bx=W*0.22, sx=W*0.8;
const cy=H*0.5;
const slitHalf=14, barrierH=H*0.45;

// Incoming rays
const nRays=9;
for(let i=0;i<nRays;i++){
const y=cy-barrierH+i*(2*barrierH/(nRays-1));
glowLine(20,y,bx-1,y,col.css,1,4);
}

// Barrier
ctx.save();
ctx.fillStyle=cssv('--surface3');ctx.strokeStyle=cssv('--border2');ctx.lineWidth=1.5;
ctx.fillRect(bx-4,cy-barrierH,8,barrierH-slitHalf);
ctx.fillRect(bx-4,cy+slitHalf,8,barrierH-slitHalf);
ctx.strokeRect(bx-4,cy-barrierH,8,barrierH-slitHalf);
ctx.strokeRect(bx-4,cy+slitHalf,8,barrierH-slitHalf);
ctx.restore();
if(OV.labels) label(bx+8,cy-barrierH+10,'a = '+(a*1e3).toFixed(3)+' mm',cssv('--text2'),'',10);

// Screen
ctx.save();
ctx.strokeStyle=cssv('--border2');ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(sx,cy-barrierH);ctx.lineTo(sx,cy+barrierH);ctx.stroke();
ctx.restore();
if(OV.labels) label(sx+4,cy-barrierH+10,'Screen',cssv('--text3'),'',10);

// Pattern on screen
const scH=barrierH*2;
const imgData=ctx.createImageData(14,Math.round(scH));
for(let py=0;py<Math.round(scH);py++){
const y_pos=py-scH/2;
const y_m=y_pos/(mmToPx*1000);
const theta=Math.atan2(y_m,L);
const beta=Math.PI*a*Math.sin(theta)/wl;
const I=beta===0?1:Math.pow(Math.sin(beta)/beta,2);
const rgba=wlToRGB(wl_nm);
const idx=py*4*14;
for(let px=0;px<14;px++){
imgData.data[idx+px*4]=rgba.r;
imgData.data[idx+px*4+1]=rgba.g;
imgData.data[idx+px*4+2]=rgba.b;
imgData.data[idx+px*4+3]=Math.round(I*255*rgba.a);
}
}
ctx.putImageData(imgData,sx,Math.round(cy-scH/2));

// Minima angles: a sinθ = mλ
const darkAngles=[];
for(let m=1;m<=6;m++){
const sinT=m*wl/a;
if(Math.abs(sinT)>1) break;
const t=Math.asin(sinT);
darkAngles.push({m,t,y:L*Math.tan(t)});
}

for(const da of darkAngles){
const fy_m=da.y;
const fy_px=cy+fy_m*mmToPx*1000;
const fy_px2=cy-fy_m*mmToPx*1000;
if(fy_px<cy+barrierH&&fy_px>cy){
dashLine(bx,cy,sx,fy_px,cssv('--text3'));
dashLine(bx,cy,sx,fy_px2,cssv('--text3'));
if(OV.labels){
label(sx+16,fy_px+4,'m='+da.m,cssv('--text3'),'',9);
label(sx+16,fy_px2+4,'m=-'+da.m,cssv('--text3'),'',9);
}
}
}

const firstMinAngle=darkAngles.length>0?darkAngles[0].t*180/Math.PI:NaN;
const centralWidth=darkAngles.length>0?(darkAngles[0].y*1e3*2).toFixed(2)+' mm':'—';

setMetrics([
{label:'Wavelength λ',value:wl_nm+' nm',sub:wlName(wl_nm)},
{label:'Slit Width a',value:(a*1e3).toFixed(3)+' mm'},
{label:'Screen Dist L',value:(L*1000).toFixed(0)+' mm'},
{label:'1st Min Angle',value:isNaN(firstMinAngle)?'—':firstMinAngle.toFixed(3)+'°',sub:'sinθ = λ/a'},
{label:'Central Width',value:centralWidth,sub:'2λL/a'},
]);
}

// ── MAIN DRAW ────────────────────────────────────────────────────
function draw(){
ctx.clearRect(0,0,W,H);
// Background gradient
const bg=ctx.createLinearGradient(0,0,W,H);
bg.addColorStop(0,cssv('--bg'));
bg.addColorStop(1,'#0d1020');
ctx.fillStyle=bg;
ctx.fillRect(0,0,W,H);

switch(expIdx){
case 0:drawSnell();break;
case 1:drawLens(true);break;
case 2:drawLens(false);break;
case 3:drawMirror();break;
case 4:drawDoublesSlit();break;
case 5:drawSingleSlit();break;
}
}

cvs.addEventListener('mousemove',e=>{if(dragging) handleDrag(e);});
document.addEventListener('mouseup',()=>dragging=false);
cvs.addEventListener('touchstart',e=>{dragging=true;handleDrag(e.touches[0]);},{passive:true});
cvs.addEventListener('touchmove',e=>{if(dragging)handleDrag(e.touches[0]);},{passive:true});
document.addEventListener('touchend',()=>dragging=false);

function handleDrag(e){
const r=cvs.getBoundingClientRect();
const x=e.clientX-r.left, y=e.clientY-r.top;

if(expIdx===0){
// drag angle based on x position relative to center
const cx=W/2, cy=H/2;
const dx=x-cx, dy=cy-y;
if(dy>5){
const ang=Math.atan2(Math.abs(dx),dy)*180/Math.PI;
state.theta1=Math.max(1,Math.min(89,Math.round(ang)));
const sl=document.getElementById('sTheta');
if(sl){sl.value=state.theta1;setText('dTheta',state.theta1+'°');setSliderPct('sTheta');}
draw();
}
}else if(expIdx===1||expIdx===2||expIdx===3){
// drag object distance
const lx=expIdx===3?W*0.75:W*0.5;
const dx=lx-x;
if(dx>10){
const newDo=Math.max(20,Math.min(400,Math.round(dx)));
state.dobject=newDo;
const sl=document.getElementById('sDobj');
if(sl){sl.value=newDo;setText('dDobj',newDo+' px');setSliderPct('sDobj');}
draw();
}
}
}

// ── RESET ────────────────────────────────────────────────────────
function resetSim(){
state.wavelength=550;state.theta1=40;state.n1=1.0;state.n2=1.5;
state.focal=120;state.dobject=200;state.slitSep=0.1;state.slitWidth=0.04;state.slitDist=500;
bindControls();
draw();
}
document.getElementById('btnReset').addEventListener('click',resetSim);

// ── KEYBOARD ─────────────────────────────────────────────────────
window.addEventListener('keydown',e=>{
if(e.code==='KeyR'){e.preventDefault();resetSim();}
if(e.code==='Space'){e.preventDefault();}
});

// ── INIT ─────────────────────────────────────────────────────────
bindControls();
window.addEventListener('load',resizeCanvas);
resizeCanvas();

} catch (_sim_err) {
  console.error('[SimEngine ErrorBoundary]', _sim_err);
  (function() {
    var fb = document.getElementById('sim-error-fallback');
    if (!fb) return;
    fb.style.display = 'flex';
    var msg = fb.querySelector('.sim-err-msg');
    if (msg) msg.textContent = String(_sim_err);
  })();
}
</script>
