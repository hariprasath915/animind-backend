
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{display:flex;gap:0;border:0.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-1)}
.ctrl{width:220px;flex-shrink:0;padding:16px;display:flex;flex-direction:column;gap:12px;border-right:0.5px solid var(--border);background:var(--surface-2)}
.sec-label{font-size:10px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.stat-box{background:var(--surface-1);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.big-num{font-size:22px;font-weight:500;color:var(--text-accent);font-variant-numeric:tabular-nums}
.small-unit{font-size:11px;color:var(--text-muted)}
.tiny{font-size:11px;color:var(--text-secondary);margin-top:2px}
.pbar-wrap{background:var(--surface-0);border-radius:3px;height:5px;overflow:hidden;margin-top:6px}
.pbar{height:100%;border-radius:3px;transition:width .4s,background .4s}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:500}
.b-vh{background:#fee2e2;color:#9b1c1c}.b-h{background:#feecdc;color:#9a3412}.b-m{background:#fef9c3;color:#854d0e}.b-s{background:#d1fae5;color:#065f46}
select{width:100%;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:7px 9px;font-size:12px;color:var(--text-primary);background:var(--surface-2);font-family:inherit;cursor:pointer}
.rrow{display:flex;align-items:center;gap:8px}
.rrow input[type=range]{flex:1}
.rval{font-size:12px;font-weight:500;color:var(--text-accent);min-width:36px;text-align:right}
.btn{width:100%;padding:8px 10px;border-radius:var(--radius);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--fill-accent);color:white;border:none}
.btn-p:hover{opacity:.9}
.btn-p:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-s{background:transparent;color:var(--text-primary);border:0.5px solid var(--border-strong)}
.btn-s:hover{background:var(--surface-1)}
.btn-r{background:var(--bg-danger);color:var(--text-danger);border:0.5px solid var(--border-danger)}
.btn-r:hover{opacity:.85}
.log{background:var(--surface-0);border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 10px;max-height:82px;overflow-y:auto;font-size:11px;color:var(--text-secondary);line-height:1.65;font-family:var(--font-mono)}
.log .hi{color:var(--text-success);font-weight:500}
.log .wn{color:var(--text-warning)}
.res{background:var(--bg-success);border:0.5px solid var(--border-success);border-radius:var(--radius);padding:10px 12px;display:none}
.res.on{display:block}
.res-title{font-size:11px;font-weight:500;color:var(--text-success);margin-bottom:6px}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px;color:var(--text-primary)}
.res-grid strong{font-weight:500}
.cvs-wrap{flex:1;background:#e8eef5;display:flex;align-items:center;justify-content:center;padding:14px}
canvas{display:block;border-radius:8px}
</style>

<h2 class="sr-only">Interactive simulation: determination of hardness of water by soap titration</h2>

<div class="wrap">
  <div class="ctrl">

    <div>
      <div class="sec-label">Water sample</div>
      <select id="sel" onchange="changeSample()">
        <option value="vh">Very hard water (~500 ppm)</option>
        <option value="h">Hard water (~250 ppm)</option>
        <option value="m" selected>Moderately hard (~150 ppm)</option>
        <option value="s">Soft water (~50 ppm)</option>
      </select>
    </div>

    <div>
      <div class="sec-label">Sample volume</div>
      <div class="rrow">
        <input type="range" id="volR" min="10" max="50" step="5" value="25" oninput="changeVol()">
        <span class="rval" id="volL">25 mL</span>
      </div>
    </div>

    <hr style="border:none;border-top:0.5px solid var(--border)">

    <div class="stat-box">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <span class="big-num" id="bNum">50.00</span>
          <span class="small-unit"> mL</span>
        </div>
        <span class="badge b-m" id="hBadge">Moderate</span>
      </div>
      <div class="tiny">Burette level remaining</div>
      <div class="pbar-wrap"><div class="pbar" id="pBar" style="width:100%;background:#378ADD"></div></div>
    </div>

    <div class="stat-box">
      <span class="big-num" id="sNum" style="color:var(--text-success)">0.00</span>
      <span class="small-unit"> mL used</span>
      <div class="tiny">Soap solution consumed</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <button class="btn btn-p" id="d1" onclick="add(.5)">Add 0.5 mL soap</button>
      <button class="btn btn-s" onclick="add(2)">Add 2 mL quickly</button>
      <button class="btn btn-r" onclick="reset()">Reset experiment</button>
    </div>

    <div>
      <div class="sec-label">Observation log</div>
      <div class="log" id="log"><span class="wn">» Experiment ready — add soap to begin.</span></div>
    </div>

    <div class="res" id="res">
      <div class="res-title">Endpoint reached</div>
      <div class="res-grid" id="resGrid"></div>
    </div>

  </div>

  <div class="cvs-wrap">
    <canvas id="c" width="430" height="540"></canvas>
  </div>
</div>

<script>
const CV = document.getElementById('c');
const cx = CV.getContext('2d');

const SAMPLES = {
  vh:{ppm:500,ep:30,bc:'b-vh',bl:'Very hard'},
  h: {ppm:250,ep:18,bc:'b-h', bl:'Hard'},
  m: {ppm:150,ep:10,bc:'b-m', bl:'Moderate'},
  s: {ppm:50, ep:4,  bc:'b-s', bl:'Soft'},
};

const ST = {
  key:'m', vol:25, cur:50, added:0,
  done:false, lather:0, scum:0,
  pts:[], bubs:[], logs:[], t:0
};

function S(){ return SAMPLES[ST.key]; }
function lerp(a,b,t){ return a+(b-a)*t; }

function pushLog(m,c=''){
  ST.logs.push({m,c});
  if(ST.logs.length>14) ST.logs.shift();
  const el=document.getElementById('log');
  el.innerHTML=ST.logs.map(l=>`<span class="${l.c}">${l.m}</span>`).join('<br>');
  el.scrollTop=el.scrollHeight;
}

function ui(){
  const s=S(), pct=(ST.cur/50)*100;
  document.getElementById('bNum').textContent=ST.cur.toFixed(2);
  document.getElementById('sNum').textContent=ST.added.toFixed(2);
  const pb=document.getElementById('pBar');
  pb.style.width=pct+'%';
  pb.style.background=pct>60?'#378ADD':pct>30?'#BA7517':'#E24B4A';
  const hb=document.getElementById('hBadge');
  hb.className='badge '+s.bc; hb.textContent=s.bl;
}

function add(v){
  if(ST.done)return;
  const s=S(), ep=s.ep*(ST.vol/25);
  ST.added=Math.min(ST.added+v, ep+0.5);
  ST.cur=Math.max(0,50-ST.added);
  ST.lather=Math.min(1,ST.added/ep);
  ST.scum=Math.max(0,Math.min(1,(ST.added/(ep*.55))*(1-ST.lather*.95)));
  for(let i=0;i<3;i++) ST.pts.push({x:215,y:285,vx:(Math.random()-.5)*.7,vy:3.5+Math.random(),life:1,r:2.5});
  bubbles(Math.ceil(v*3));
  ui();
  const p=ST.lather;
  if(p<.25) pushLog(`» +${v}mL — heavy scum, no lather`,'wn');
  else if(p<.55) pushLog(`» +${v}mL — scum reducing…`,'wn');
  else if(p<.85) pushLog(`» +${v}mL — unstable lather forming`);
  else if(p<1)   pushLog(`» +${v}mL — lather nearly stable…`);
  if(!ST.done&&ST.added>=ep){
    ST.done=true;
    pushLog(`» Stable lather — ENDPOINT reached`,'hi');
    pushLog(`» ${ST.added.toFixed(2)} mL soap for ${ST.vol} mL sample`,'hi');
    document.getElementById('d1').disabled=true;
    document.getElementById('res').classList.add('on');
    const f=(s.ppm/17.85).toFixed(1), cl=(s.ppm/14.25).toFixed(1);
    document.getElementById('resGrid').innerHTML=
      `<div>Volume: <strong>${ST.added.toFixed(2)} mL</strong></div>
       <div>Hardness: <strong>~${s.ppm} ppm</strong></div>
       <div>French: <strong>${f} °f</strong></div>
       <div>Clark: <strong>${cl} °Cl</strong></div>`;
    ui();
  }
}

function bubbles(n){
  for(let i=0;i<n;i++) ST.bubs.push({
    x:105+Math.random()*110, y:410+Math.random()*20,
    r:1.5+Math.random()*4, vy:-(0.4+Math.random()),
    life:1, max:70+Math.random()*60
  });
}

function reset(){
  Object.assign(ST,{cur:50,added:0,done:false,lather:0,scum:0,pts:[],bubs:[],logs:[],t:0});
  document.getElementById('d1').disabled=false;
  document.getElementById('res').classList.remove('on');
  document.getElementById('log').innerHTML='<span class="wn">» Experiment ready — add soap to begin.</span>';
  ui();
}

function changeSample(){ ST.key=document.getElementById('sel').value; reset(); }
function changeVol(){ ST.vol=parseInt(document.getElementById('volR').value); document.getElementById('volL').textContent=ST.vol+' mL'; reset(); }

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function draw(){
  const W=430,H=540;
  cx.clearRect(0,0,W,H);
  const dark=document.documentElement.getAttribute('data-mode')==='dark'||(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);

  const bg    = dark?'#111827':'#dde8f4';
  const bench = dark?'#1e293b':'#c8d5e5';
  const metal = dark?'#475569':'#94a3b8';
  const gs    = dark?'rgba(148,210,255,.45)':'rgba(37,99,192,.38)';
  const gh    = dark?'rgba(200,230,255,.12)':'rgba(255,255,255,.55)';
  const lc    = dark?'#64748b':'#94a3b8';
  const tc    = dark?'#94a3b8':'#475569';

  cx.fillStyle=bg; rr(cx,0,0,W,H,8); cx.fill();

  cx.fillStyle=bench; rr(cx,10,H-60,W-20,52,6); cx.fill();
  cx.fillStyle=dark?'#111827':'#b0bfcf'; cx.fillRect(10,H-60,W-20,3);

  const sx=52;
  cx.strokeStyle=metal; cx.lineWidth=7; cx.lineCap='round';
  cx.beginPath(); cx.moveTo(sx,H-60); cx.lineTo(sx,52); cx.stroke();
  cx.fillStyle=dark?'#334155':'#aab8c8'; rr(cx,sx-22,H-65,44,12,4); cx.fill();
  cx.strokeStyle=metal; cx.lineWidth=5;
  [188,320].forEach(y=>{cx.beginPath();cx.moveTo(sx,y);cx.lineTo(sx+60,y);cx.stroke();});
  [188,320].forEach(y=>{
    cx.fillStyle=dark?'#2563C0':'#3b82f6';
    rr(cx,sx+55,y-7,18,14,3); cx.fill();
    cx.strokeStyle=dark?'#2563C0':'#3b82f6'; cx.lineWidth=3;
    cx.beginPath(); cx.moveTo(sx+55,y); cx.lineTo(sx+50,y-10); cx.lineTo(sx+50,y+10); cx.stroke();
  });

  drawBurette(cx,215,52,ST.cur/50,gs,gh,lc,dark);
  drawFlask(cx,160,335,ST.lather,ST.scum,gs,gh,dark);
  drawCylinder(cx,348,120,ST.vol/50,gs,gh,lc,dark);

  ST.pts=ST.pts.filter(p=>p.life>0);
  ST.pts.forEach(p=>{
    cx.globalAlpha=p.life*.9;
    cx.fillStyle='#60a5fa';
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();
    cx.globalAlpha=1;
    p.x+=p.vx;p.y+=p.vy;p.vy+=.32;p.life-=.058;
  });

  ST.bubs=ST.bubs.filter(b=>b.life>0);
  ST.bubs.forEach(b=>{
    cx.globalAlpha=b.life*.4;
    cx.strokeStyle=ST.lather>.65?'#6ee7b7':'#93c5fd';
    cx.lineWidth=.8;
    cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.stroke();
    cx.globalAlpha=1;
    b.y+=b.vy;b.x+=(Math.random()-.5)*.3;b.life-=1/b.max;
    if(b.y<340)b.life=0;
  });

  cx.fillStyle=tc; cx.font='11px system-ui,sans-serif'; cx.textAlign='center';
  cx.fillText('Burette (50 mL)',215,44);
  cx.fillText('Conical flask',160,328);
  cx.fillText(`${ST.vol} mL sample`,160,340);
  cx.fillText('Graduated',348,113);
  cx.fillText('cylinder',348,125);

  if(ST.scum>.07){
    cx.fillStyle=dark?'#ca8a04':'#92400e'; cx.font='10px system-ui,sans-serif'; cx.textAlign='left';
    cx.fillText('Ca²⁺/Mg²⁺ scum',248,430);
  }
  if(ST.lather>.3){
    cx.fillStyle=dark?'#38bdf8':'#1d4ed8'; cx.textAlign='left';
    cx.fillText('soap lather',248,406);
  }
  if(ST.done){
    cx.fillStyle=dark?'#4ade80':'#15803d';
    cx.font='bold 12px system-ui,sans-serif'; cx.textAlign='center';
    cx.fillText('Stable lather — endpoint',215,H-68);
  }

  ST.t++; requestAnimationFrame(draw);
}

function drawBurette(ctx,x,y,frac,gs,gh,lc,dark){
  const bW=18,bH=210;
  const lH=frac*(bH-10), lY=y+bH-lH;
  ctx.fillStyle=dark?'rgba(96,165,250,.38)':'rgba(37,99,192,.28)';
  ctx.fillRect(x-bW/2+2,lY,bW-4,lH);
  if(lH>6){
    ctx.fillStyle=dark?'rgba(59,130,246,.65)':'rgba(37,99,192,.55)';
    ctx.beginPath();ctx.moveTo(x-bW/2+2,lY+6);ctx.quadraticCurveTo(x,lY+1,x+bW/2-2,lY+6);ctx.lineTo(x+bW/2-2,lY);ctx.lineTo(x-bW/2+2,lY);ctx.fill();
  }
  ctx.strokeStyle=gs;ctx.lineWidth=1.8;ctx.strokeRect(x-bW/2,y,bW,bH);
  ctx.fillStyle=gh;ctx.fillRect(x-bW/2+2,y+5,5,bH-10);
  for(let i=0;i<=10;i++){
    const gy=y+i*(bH/10);
    ctx.strokeStyle=lc;ctx.lineWidth=.7;
    ctx.beginPath();ctx.moveTo(x+bW/2,gy);ctx.lineTo(x+bW/2+(i%5===0?9:4),gy);ctx.stroke();
    if(i%5===0){ctx.fillStyle=lc;ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText(`${i*5}`,x+bW/2+11,gy+3);}
  }
  ctx.fillStyle=dark?'#334155':'#c0cdd9';rr(ctx,x-bW/2,y+bH,bW,13,3);ctx.fill();
  ctx.fillStyle=dark?'#1e40af':'#1d4ed8';ctx.beginPath();ctx.arc(x,y+bH+12,5.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dark?'#1e3a5f':'#1e3a8a';ctx.fillRect(x-1.8,y+bH+18,3.6,22);
  ctx.fillStyle=dark?'#4ade80':'#15803d';rr(ctx,x-9,y+bH+9,18,7,3);ctx.fill();
}

function drawFlask(ctx,cx2,by,lather,scum,gs,gh,dark){
  const fH=170,tW=28,bW=138,nH=36,bt=by+nH,bb=by+fH;
  const r=Math.round(lerp(120,175,1-lather));
  const g=Math.round(lerp(190,162,1-lather));
  const b=Math.round(lerp(228,105,1-lather));
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx2,by);ctx.lineTo(cx2-tW/2,by+nH);ctx.lineTo(cx2-bW/2,by+fH);ctx.lineTo(cx2+bW/2,by+fH);ctx.lineTo(cx2+tW/2,by+nH);ctx.closePath();ctx.clip();
  ctx.fillStyle=`rgba(${r},${g},${b},${dark?.48:.4})`;
  ctx.fillRect(cx2-bW/2,bt,bW,bb-bt);
  if(scum>.03){
    const sh=scum*20,sy=bb-22-sh;
    ctx.fillStyle=dark?'rgba(146,128,88,.48)':'rgba(178,162,118,.52)';
    for(let i=0;i<5;i++){const sw=scum*(bW-28);ctx.beginPath();ctx.ellipse(cx2+(i-2)*22,sy+Math.sin(i*1.4)*5,sw*.2,sh*.55,0,0,Math.PI*2);ctx.fill();}
  }
  if(lather>.06){
    const lh=lather*72,ly=bb-18-lh,lw=lerp(0,bW-12,lather);
    ctx.fillStyle=dark?'rgba(219,234,254,.16)':'rgba(239,246,255,.48)';
    ctx.fillRect(cx2-lw/2,ly,lw,lh);
    const n=Math.floor(lather*32);
    for(let i=0;i<n;i++){
      const bx=cx2-lw/2+Math.random()*lw,b2y=ly+Math.random()*lh,br=3+Math.random()*6;
      ctx.fillStyle=dark?'rgba(186,218,254,.1)':'rgba(255,255,255,.42)';
      ctx.beginPath();ctx.arc(bx,b2y,br,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=dark?'rgba(147,197,253,.18)':'rgba(147,197,253,.48)';ctx.lineWidth=.6;ctx.stroke();
    }
  }
  if(ST.done){ctx.fillStyle=dark?'rgba(74,222,128,.1)':'rgba(134,239,172,.18)';ctx.fillRect(cx2-bW/2,bt,bW,bb-bt);}
  ctx.restore();
  ctx.strokeStyle=gs;ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(cx2-tW/2-1,by);ctx.lineTo(cx2-bW/2-2,by+fH);ctx.lineTo(cx2+bW/2+2,by+fH);ctx.lineTo(cx2+tW/2+1,by);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx2-tW/2-1,by);ctx.lineTo(cx2-tW/2+1,by-18);ctx.moveTo(cx2+tW/2+1,by);ctx.lineTo(cx2+tW/2-1,by-18);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx2-tW/2+1,by-18);ctx.lineTo(cx2+tW/2-1,by-18);ctx.stroke();
  ctx.fillStyle=gh;ctx.fillRect(cx2+6,bt+12,5,bb-bt-30);
}

function drawCylinder(ctx,cx2,y,frac,gs,gh,lc,dark){
  const cW=24,cH=195;
  const fH2=frac*(cH-16),fY=y+cH-fH2;
  ctx.fillStyle=dark?'rgba(96,165,250,.36)':'rgba(147,197,253,.36)';
  ctx.fillRect(cx2-cW/2+2,fY,cW-4,fH2);
  if(fH2>5){ctx.fillStyle=dark?'rgba(59,130,246,.58)':'rgba(37,99,192,.52)';ctx.beginPath();ctx.moveTo(cx2-cW/2+2,fY+5);ctx.quadraticCurveTo(cx2,fY+1,cx2+cW/2-2,fY+5);ctx.lineTo(cx2+cW/2-2,fY);ctx.lineTo(cx2-cW/2+2,fY);ctx.fill();}
  ctx.strokeStyle=gs;ctx.lineWidth=1.5;ctx.strokeRect(cx2-cW/2,y,cW,cH);
  ctx.fillStyle=gh;ctx.fillRect(cx2+cW/2-6,y+5,4,cH-10);
  for(let i=0;i<=10;i++){
    const gy=y+i*(cH/10);
    ctx.strokeStyle=lc;ctx.lineWidth=.7;
    ctx.beginPath();ctx.moveTo(cx2-cW/2-(i%5===0?8:4),gy);ctx.lineTo(cx2-cW/2,gy);ctx.stroke();
    if(i%5===0){ctx.fillStyle=lc;ctx.font='9px monospace';ctx.textAlign='right';ctx.fillText(`${50-i*5}`,cx2-cW/2-11,gy+3);}
  }
  ctx.fillStyle=dark?'#334155':'#c0cdd9';
  rr(ctx,cx2-cW/2-4,y+cH,cW+8,10,3);ctx.fill();
  rr(ctx,cx2-cW/2-6,y+cH+10,cW+12,8,3);ctx.fill();
}

ui(); draw();
</script>
